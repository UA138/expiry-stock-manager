databases:
  # 無料プランは作成から約30日で期限切れになるため、2026-08-26にdb2として作り直した
  - name: expiry-stock-manager-db2
    plan: free
    databaseName: expiry_stock_manager_db2
    user: expiry_stock_manager_db2_user

services:
  - type: web
    name: expiry-stock-manager
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate"
    startCommand: "gunicorn config.wsgi:application"
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: DATABASE_URL
        fromDatabase:
          name: expiry-stock-manager-db2
          property: connectionString
      - key: PYTHON_VERSION
        value: "3.12.7"