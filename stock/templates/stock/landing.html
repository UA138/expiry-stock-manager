<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>賞味期限アラート付き在庫管理システム</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
  body { background-color: #f5f6f8; min-height: 100vh; display: flex; align-items: center; }
  .landing-card { max-width: 560px; margin: auto; }
  .feature-list li { margin-bottom: 0.4rem; }
</style>
</head>
<body>
<div class="landing-card w-100 px-3 py-5">
  <div class="card shadow-sm">
    <div class="card-body p-4 p-md-5">
      <h1 class="h3 text-center mb-1">賞味期限アラート付き<br>在庫管理システム</h1>
      <p class="text-center text-muted mb-4">食品在庫を、店頭・倉庫・賞味期限ロット別に<br>管理するデモアプリです</p>

      <ul class="feature-list text-muted mb-4 ps-3">
        <li>在庫一覧・編集(店頭 / 倉庫)</li>
        <li>入庫・出庫登録、棚卸し</li>
        <li>賞味期限が近いロットから優先的に消化する予測在庫照会(FEFO)</li>
        <li>入出庫履歴の閲覧・CSV出力</li>
      </ul>

      <div class="d-grid gap-2">
        <a href="{% url 'stock:login' %}" class="btn btn-success">ログイン</a>
        <a href="{% url 'stock:register' %}" class="btn btn-outline-secondary">新規登録(お試し用アカウントを作成)</a>
      </div>

      <p class="text-center text-muted small mt-4 mb-0">
        無料プランで稼働しているため、しばらくアクセスがないと表示まで数十秒かかる場合があります。
      </p>
    </div>
  </div>
</div>
</body>
</html>
