<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>新規登録｜賞味期限アラート付き在庫管理システム</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
  body { background-color: #f5f6f8; height: 100vh; display: flex; align-items: center; }
  .register-card { max-width: 400px; margin: auto; }
</style>
</head>
<body>
<div class="register-card w-100 px-3">
  <div class="card shadow-sm">
    <div class="card-body p-4">
      <h1 class="h4 text-center mb-1">新規ユーザー登録</h1>
      <p class="text-center text-muted mb-4 small">担当者アカウントとして登録されます</p>

      {% if errors %}
      <div class="alert alert-danger py-2">
        {% for e in errors %}<div>{{ e }}</div>{% endfor %}
      </div>
      {% endif %}

      <form method="post">
        {% csrf_token %}
        <div class="mb-3">
          <label class="form-label fw-bold">ユーザーID <span class="text-danger">*</span></label>
          <input type="text" class="form-control" name="username" value="{{ username }}"
                 autofocus autocomplete="off" placeholder="ログインIDを入力">
        </div>
        <div class="mb-3">
          <label class="form-label fw-bold">パスワード <span class="text-danger">*</span></label>
          <input type="password" class="form-control" name="password"
                 autocomplete="new-password" placeholder="パスワードを入力">
        </div>
        <div class="mb-4">
          <label class="form-label fw-bold">パスワード（確認） <span class="text-danger">*</span></label>
          <input type="password" class="form-control" name="password2"
                 autocomplete="new-password" placeholder="もう一度入力">
        </div>
        <button type="submit" class="btn btn-success w-100">登録してログイン</button>
      </form>

      <div class="text-center mt-3">
        <a href="{% url 'stock:login' %}" class="text-muted small">ログイン画面に戻る</a>
      </div>
    </div>
  </div>
</div>
</body>
</html>
